name: Bootstrap Stage 5 APK Build

on:
  push:
    branches:
      - stage5/openwrt-apk-build
    paths:
      - .github/workflows/bootstrap-stage5.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose-luci:
    runs-on: ubuntu-24.04
    steps:
      - name: Download build diagnostics
        uses: actions/download-artifact@v4
        with:
          name: openwrt2mqtt-stage5-diagnostics
          path: diagnostics
          github-token: ${{ github.token }}
          repository: nymanyim/openwrt2mqtt
          run-id: 30505003362

      - name: Expose LuCI build errors
        shell: bash
        run: |
          set -euo pipefail
          test -s diagnostics/luci-build.log
          tail -80 diagnostics/luci-build.log | while IFS= read -r line; do
            message=$(printf '%s' "${line}" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error file=package/luci-app-openwrt2mqtt/Makefile::${message}"
          done
          exit 1
