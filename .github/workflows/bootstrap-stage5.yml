name: Bootstrap Stage 5 APK Build

on:
  push:
    branches:
      - stage5/openwrt-apk-build
    paths:
      - .github/workflows/bootstrap-stage5.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose-luci:
    runs-on: ubuntu-24.04
    steps:
      - name: Download build diagnostics
        uses: actions/download-artifact@v4
        with:
          name: openwrt2mqtt-stage5-diagnostics
          path: diagnostics
          github-token: ${{ github.token }}
          repository: nymanyim/openwrt2mqtt
          run-id: 30505003362

      - name: Extract precise LuCI compiler failures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          log_path = Path("diagnostics/luci-build.log")
          lines = log_path.read_text(errors="replace").splitlines()
          patterns = [
              re.compile(r"^.*?:\d+(?::\d+)?:\s+(?:fatal\s+)?error:", re.IGNORECASE),
              re.compile(r"undefined reference to", re.IGNORECASE),
              re.compile(r"collect2:\s*error:", re.IGNORECASE),
              re.compile(r"(?:^|\s)ld(?:\.bfd)?:\s+.*(?:error|cannot find)", re.IGNORECASE),
              re.compile(r"ninja:\s+error:", re.IGNORECASE),
          ]

          matches = []
          for index, line in enumerate(lines):
              if any(pattern.search(line) for pattern in patterns):
                  matches.append(index)

          def escape(value: str) -> str:
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          if not matches:
              candidates = [
                  (index, line) for index, line in enumerate(lines)
                  if re.search(r"(?:FAILED:|fatal|error:|undefined reference|No such file)", line, re.IGNORECASE)
              ]
              matches = [index for index, _ in candidates[-12:]]

          if not matches:
              print("::error file=package/luci-app-openwrt2mqtt/Makefile,title=LuCI diagnostics::No compiler diagnostic matched")
              raise SystemExit(1)

          emitted = 0
          seen = set()
          for index in matches:
              context = []
              for current in range(max(0, index - 2), min(len(lines), index + 3)):
                  text = lines[current].strip()
                  if text and len(text) <= 1800:
                      context.append(f"L{current + 1}: {text}")
              message = " | ".join(context) or f"L{index + 1}: {lines[index][:1800]}"
              if message in seen:
                  continue
              seen.add(message)
              emitted += 1
              print(
                  "::error file=package/luci-app-openwrt2mqtt/Makefile,"
                  f"title=LuCI compiler failure {emitted}::{escape(message[:5000])}"
              )
              if emitted >= 12:
                  break

          raise SystemExit(1)
          PY
