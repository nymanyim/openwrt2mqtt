name: Bootstrap Stage 5 APK Build

on:
  push:
    branches:
      - stage5/openwrt-apk-build
    paths:
      - .github/workflows/bootstrap-stage5.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose-luci:
    runs-on: ubuntu-24.04
    steps:
      - name: Download build diagnostics
        uses: actions/download-artifact@v4
        with:
          name: openwrt2mqtt-stage5-diagnostics
          path: diagnostics
          github-token: ${{ github.token }}
          repository: nymanyim/openwrt2mqtt
          run-id: 30505003362

      - name: Extract LuCI compiler failure
        shell: bash
        run: |
          set -euo pipefail
          log=diagnostics/luci-build.log
          test -s "${log}"
          python3 - <<'PY'
          from pathlib import Path
          import re

          lines = Path("diagnostics/luci-build.log").read_text(errors="replace").splitlines()
          pattern = re.compile(
              r"(^FAILED:|\berror:|\bfatal error:|undefined reference|cannot find|not found|No such file|collect2:)",
              re.IGNORECASE,
          )
          matches = [index for index, line in enumerate(lines) if pattern.search(line)]
          if not matches:
              start = max(0, len(lines) - 160)
              selected = lines[start:]
          else:
              start = max(0, matches[0] - 12)
              end = min(len(lines), matches[0] + 28)
              selected = lines[start:end]

          message = " | ".join(selected)
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error file=package/luci-app-openwrt2mqtt/Makefile,title=LuCI compiler failure::{message[:6000]}")
          PY
          exit 1
