name: Build OpenWrt APKs

on:
  workflow_dispatch:
    inputs:
      release:
        description: "构建成功后发布 GitHub Release（仅 main 分支）"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
      - "ux/**"
    paths:
      - ".github/workflows/build-openwrt.yml"
      - "cmd/**"
      - "internal/**"
      - "package/**"
      - "tests/**"
      - "go.mod"
      - "go.sum"
      - "LICENSE"
      - "Makefile"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: openwrt-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_VERSION: "25.12.5"
  OPENWRT_TARGET: "rockchip"
  OPENWRT_SUBTARGET: "armv8"
  SDK_ARCHIVE: "openwrt-sdk-25.12.5-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-24.04
    outputs:
      package_version: ${{ steps.package.outputs.version }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Release 只能从 main 分支发布。" >&2
            exit 1
          fi

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^PKG_VERSION:=//p' package/openwrt2mqtt/Makefile)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=openwrt2mqtt-${version}-openwrt-${OPENWRT_VERSION}-${OPENWRT_TARGET}-${OPENWRT_SUBTARGET}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  build:
    name: OpenWrt 25.12.5 rockchip/armv8
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install SDK host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates file gawk gettext git \
            libncurses-dev libssl-dev python3 rsync unzip wget zstd

      - name: Download and verify OpenWrt SDK
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}"
          wget -q "${base_url}/sha256sums" -O sha256sums
          wget -q "${base_url}/${SDK_ARCHIVE}" -O "${SDK_ARCHIVE}"
          grep -F " *${SDK_ARCHIVE}" sha256sums | sha256sum --check --strict -
          mkdir openwrt-sdk
          tar --zstd -xf "${SDK_ARCHIVE}" --strip-components=1 -C openwrt-sdk
          rm -f "${SDK_ARCHIVE}"

      - name: Configure package feeds
        working-directory: openwrt-sdk
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update base packages luci
          ./scripts/feeds install golang luci-base
          test -L package/feeds/base/lua
          test -L package/feeds/base/ucode
          test -L package/feeds/base/libnl-tiny

      - name: Add openwrt2mqtt packages
        shell: bash
        run: |
          set -euo pipefail
          ln -s "${GITHUB_WORKSPACE}/package/openwrt2mqtt" openwrt-sdk/package/openwrt2mqtt
          ln -s "${GITHUB_WORKSPACE}/package/luci-app-openwrt2mqtt" openwrt-sdk/package/luci-app-openwrt2mqtt
          make -C openwrt-sdk defconfig
          printf '%s\n' 'CONFIG_PACKAGE_luci-i18n-openwrt2mqtt-zh-cn=m' >> openwrt-sdk/.config
          make -C openwrt-sdk defconfig

      - name: Build core, LuCI, and Simplified Chinese APKs
        shell: bash
        run: |
          set -euo pipefail
          make -C openwrt-sdk package/openwrt2mqtt/compile \
            OPENWRT2MQTT_SOURCE_DIR="${GITHUB_WORKSPACE}" V=s -j"$(nproc)"
          make -C openwrt-sdk package/luci-app-openwrt2mqtt/compile \
            OPENWRT2MQTT_SOURCE_DIR="${GITHUB_WORKSPACE}" V=s -j"$(nproc)"

      - name: Collect and verify APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find openwrt-sdk/bin/packages -type f \
            \( -name 'openwrt2mqtt-*.apk' -o -name 'luci-app-openwrt2mqtt-*.apk' -o -name 'luci-i18n-openwrt2mqtt-zh-cn-*.apk' \) \
            -exec cp -v {} artifacts/ \;
          test "$(find artifacts -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 3
          test "$(find artifacts -maxdepth 1 -type f -name 'luci-i18n-openwrt2mqtt-zh-cn-*.apk' | wc -l)" -eq 1
          find artifacts -maxdepth 1 -type f -name '*.apk' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | tee artifacts/SHA256SUMS
          file artifacts/*.apk | tee artifacts/FILE_TYPES.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.test.outputs.artifact_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    needs:
      - test
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ needs.test.outputs.package_version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release 标签 ${tag} 已存在，请先更新 PKG_VERSION。" >&2
            exit 1
          fi

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.test.outputs.artifact_name }}
          path: release-assets

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 3
          test -f release-assets/SHA256SUMS
          test -f release-assets/FILE_TYPES.txt
          (cd release-assets && sha256sum --check SHA256SUMS)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.test.outputs.package_version }}
          name: openwrt2mqtt ${{ needs.test.outputs.package_version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS
            release-assets/FILE_TYPES.txt
